syntax = "proto3";

package continuum;

service GameService {
  rpc GetGameStatus(GameRequest) returns (GameResponse);
}

message GameRequest {
  string game_name = 1;
  int64 lamport_timestamp = 2;
}

message GameResponse {
  string status = 1;
  int64 lamport_timestamp = 2;
}

// Experiment 4: Mutual Exclusion Service (Ricart-Agrawala Algorithm)
service MutexService {
  rpc RequestAccess(MutexRequest) returns (MutexResponse);
}

message MutexRequest {
  int32 node_id = 1;
  int64 lamport_timestamp = 2;
}

message MutexResponse {
  int32 node_id = 1;
  int64 lamport_timestamp = 2;
  bool granted = 3;
}

// --- Experiment 5: Deadlock simulation & resolution ---
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply);
  rpc ReleaseLock (LockRequest) returns (LockReply);
}

message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}

message LockReply {
  bool granted = 1;
  string message = 2;
}

// --- Experiment 6: Load Balancing (Least Connections) ---
service WorkerService {
  rpc HandleRequest (WorkRequest) returns (WorkReply);
}

message WorkRequest {
  int32 request_id = 1;
}

message WorkReply {
  int32 request_id = 1;
  string handled_by = 2;
  string status = 3;
}

// --- Experiment 7: Eventual Consistency via Gossip Replication + Last-Write-Wins ---
// Replicated key-value style store. Each replica exposes the same
// three RPCs to clients AND to its peer replicas.
service ReplicaService {
  rpc SaveValue (ValueUpdate) returns (SaveAck); // client -> replica (local write)
  rpc SyncUpdate (ValueUpdate) returns (SaveAck); // replica -> replica (gossip)
  rpc GetValue (ValueQuery) returns (ValueState); // read current state
}

message ValueUpdate {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}

message SaveAck {
  bool accepted = 1;
  string replica = 2;
  int32 lamport_timestamp = 3;
}

message ValueQuery {
  string key = 1;
}

message ValueState {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}